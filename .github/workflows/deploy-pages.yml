name: Deploy CAMPVERSE preview
on:
  push:
    branches: [main]
    paths:
      - 'campverse-source-v4.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract app source
        run: unzip -o campverse-source-v4.zip -d source
      - name: Install packages and build app
        working-directory: source
        run: npm ci && npm run build -- --base=/campverse-social/
      - name: Upload Pages artifact
